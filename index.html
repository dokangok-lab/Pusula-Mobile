const b64=b=>{let s="";new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(p,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(obj,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await mkKey(p,salt),new TextEncoder().encode(JSON.stringify(obj)));
 return JSON.stringify({app:"kasse",v:2,salt:b64(salt),iv:b64(iv),data:b64(c)})}
async function dec(f,p){const c=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(f.iv)},await mkKey(p,unb64(f.salt)),unb64(f.data));
 return JSON.parse(new TextDecoder().decode(c))}

function tx(s){if(lang==="de"||!s)return s;const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];if(!c)return s;

let obs=null,busy=false,pend=false;
function watch(){if(typeof MutationObserver==="undefined")return;
 if(!obs)obs=new MutationObserver(()=>{if(busy||pend)return;pend=true;requestAnimationFrame(()=>{pend=false;applyLang()})});
 obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["placeholder"]})}
function applyLang(){
 if(busy||typeof document.createTreeWalker!=="function")return;busy=true;
 try{if(obs)obs.disconnect();
  const w=document.createTreeWalker(document.body,4);let n;
  while((n=w.nextNode())){const p=n.parentNode&&n.parentNode.tagName;if(p==="SCRIPT"||p==="STYLE")continue;
   if(n.__t===undefined||n.nodeValue!==n.__t)n.__o=n.nodeValue;
   const o=tx(n.__o);if(n.nodeValue!==o)n.nodeValue=o;n.__t=o}
  document.querySelectorAll("[placeholder]").forEach(e=>{if(e.__pt===undefined||e.placeholder!==e.__pt)e.__po=e.placeholder;
   const o=tx(e.__po);if(e.placeholder!==o)e.placeholder=o;e.__pt=o})
 }finally{busy=false;watch()}}

async function fetchRates(quiet){const r=data.rates;
 if(typeof navigator!=="undefined"&&navigator.onLine===false){ui.rs="off";rRates();if(!quiet)toast("Keine Verbindung");return}
 ui.rs="busy";rRates();
 try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  const res=await fetch(RSRC,{signal:ac.signal,cache:"no-store"});clearTimeout(t);
  if(!res.ok)throw new Error("http");const j=await res.json();
  const eg=Number(j&&j.xau&&j.xau.price),ug=Number(j&&j.per_gram_usd);
  if(!(eg>0)||!(ug>0))throw new Error("data");
  if(j.stale===true){ui.rs="old";rRates();if(!quiet)toast("Quelle meldet veraltete Daten");return}
  if(!Array.isArray(r.adj))r.adj=["",""];
  const gb=BC()==="USD"?ug:eg,fx=BC()==="USD"?ug/eg:eg/ug,gk=f2c(gb+parse(r.adj[0]),2),gv=f2c(gb+parse(r.adj[1]),2),u=f2c(fx,4);r.gold=[gk,gv];r.usd=[u,u];r.at=now();r.net=now();ui.rs="";
  rRates();if(ui.s==="prod"&&ui.pd)calcP();if(!quiet)toast("Kurse aktualisiert")}
 catch(e){ui.rs=(typeof navigator!=="undefined"&&navigator.onLine===false)?"off":"err";rRates();if(!quiet)toast("Abruf fehlgeschlagen")}}

 const done=data.prods.filter(p=>p.status==="done"),gold={},spec={};
 done.forEach(p=>{p.metal.forEach(m=>{const k=parse(m.fine);if(k)gold[k]=(gold[k]||0)+parse(m.qty)});

/* ---------- Excel-Export (echte .xlsx, ohne Fremdbibliothek) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=-1;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0}})();
function zipStore(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
 files.forEach(([name,text])=>{const nb=enc.encode(name),d=enc.encode(text),c=CRC(d);
  const lh=Uint8Array.from([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,d);
  cen.push(Uint8Array.from([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+d.length});
 let cl=0;cen.forEach(x=>cl+=x.length);
 const end=Uint8Array.from([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)]);
 return new Blob([...parts,...cen,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xcol=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xesc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function xlsx(sheets){const sh=sheets.map(([n,rows])=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="30" width="18" customWidth="1"/></cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=xcol(ci)+(ri+1);
  if(v===null||v===undefined||v==="")return"";
  if(typeof v==="number"&&isFinite(v))return`<c r="${ref}"><v>${v}</v></c>`;
  return`<c r="${ref}" t="inlineStr"${ri===0?' s="1"':""}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join("")}</row>`).join("")}</sheetData></worksheet>`);
 const F=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
 ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
 ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n],i)=>`<sheet name="${xesc(n).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`],
 ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
 ["xl/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
 ...sh.map((x,i)=>[`xl/worksheets/sheet${i+1}.xml`,x])];
 return zipStore(F)}

function xLager(){return["Lager",[["Gruppe","Nummer","Bezeichnung","Einheit","Feingehalt","Bestand","Herkunft","Art","Farbe","Reinheit","Schliff","Karat je Stein","Notiz"],...data.stock.map(s=>[s.group,s.code||"",s.name,UL[s.unit]||s.unit,Number(s.fine)||"",Math.round(qtyOf(s.id)*1000)/1000,s.nat||"",s.type||"",s.color||"",s.clar||"",s.cut||"",Number(parse(s.ct))||"",s.note||""])]]}

function xKasse(){return["Kontobuch",[["Datum","Kontobuch","Art","Kategorie","Betrag","Notiz"],...data.entries.slice().sort((a,b)=>String(a.date).localeCompare(b.date)).map(e=>[e.date,e.book?bkName(e.book):"Hauptbuch",e.type,e.cat,e.amount,e.note||""])]]}
async function xSave(kind){
 const sheets=kind==="lager"?[xLager(),xWare()]:[xLager(),xWare(),xKonten(),xBuch(),xKasse(),xOrd()];
 const name=(data.user||"Export")+(kind==="lager"?"_Lager":"_Alles")+".xlsx";
 try{const blob=xlsx(sheets),d=await claude.use("downloads");
  if(d)await d.save({filename:name,data:blob});
  else{const f=new File([blob],name),a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;a.click()}
  toast("Excel bereit")}catch(e){toast("Nicht gespeichert")}}
