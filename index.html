<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#eceff6;--card:#fff;--tx:#1d1d2b;--mu:#6b6b80;--ac:#4a2bb8;--hd:#2e1578;--in:#0a7d5a;--out:#c8372d;--bd:#d9dbe8;--fld:#f6f7fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0b12;--card:#17171f;--tx:#f2f2f7;--mu:#9a9aae;--ac:#8b73ff;--hd:#3b1d99;--in:#30c48d;--out:#ff6b61;--bd:#2d2d3a;--fld:#0f0f16}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0b12;--card:#17171f;--tx:#f2f2f7;--mu:#9a9aae;--ac:#8b73ff;--hd:#3b1d99;--in:#30c48d;--out:#ff6b61;--bd:#2d2d3a;--fld:#0f0f16}
*{box-sizing:border-box;touch-action:manipulation}html,body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;padding:12px 12px 130px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 12px}
#who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}#bSave{white-space:nowrap;padding-left:9px;padding-right:9px}
@media (max-width:520px){#main>.nav button.sm{padding:6px 8px}#bSave{font-size:14px}#main>.nav>div{gap:4px!important;margin-left:auto}#main>.nav{flex-wrap:wrap}#who{flex:1 0 auto;max-width:100%}}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;font-weight:600;width:100%}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.sm{width:auto;padding:6px 12px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--fld);margin:0}
input[readonly]{opacity:.75}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;min-height:46px}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}
.mu{color:var(--mu);font-size:14px}.in{color:var(--in)}.out{color:var(--out)}
.sum{display:flex;justify-content:space-between;text-align:center;gap:8px}.sum b{display:block;font-size:18px}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.it:last-child{border:0}.it small{display:block;color:var(--mu)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.hide{display:none}.click{cursor:pointer}.r{text-align:right}
.rb{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border-radius:14px;padding:8px;margin-bottom:10px;cursor:pointer}
.rc{flex:1;text-align:center;font-size:12px;line-height:1.3}.rc b{display:block}.rc span{color:var(--mu)}
.bar{background:linear-gradient(90deg,var(--hd),var(--ac));color:#fff;padding:9px 12px;border-radius:12px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:8px}.f span{display:block;font-size:12px;color:var(--mu);margin:0 0 3px 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>.f{min-width:0}
.ck{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:15px}.ck input{width:auto}
.tg{display:flex}.tg button{border-radius:0;padding:9px}.tg button:first-child{border-radius:10px 0 0 10px}.tg button:last-child{border-radius:0 10px 10px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 4px;font-weight:500;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:center;min-height:62px}
.tiles button b{font-size:16px;color:var(--ac)}
.risk{border-radius:14px;padding:12px;margin-bottom:12px;color:#fff;background:#0f7f6a}.risk.neg{background:#a53a33}
.risk .big{font-size:24px;font-weight:700}.risk small{opacity:.85}
.tbl .th,.tbl .tr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tbl .th{font-weight:600;color:var(--ac)}
.rowc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.rf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.navb{flex:1;text-align:center;padding:12px 6px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--bd);color:var(--tx);background:var(--fld)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{width:auto;white-space:nowrap;padding:7px 12px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--fld);border:1px solid var(--bd);color:var(--mu)}
[data-a]{cursor:pointer;-webkit-tap-highlight-color:transparent}[data-a] *{pointer-events:none}
.nb{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px)*.25 + 2px);display:flex;gap:2px;background:var(--hd);padding:6px;border-radius:20px;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.nb button{background:none;color:#d6ccff;font-size:10px;padding:6px 0;border-radius:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px}
.nb button span{font-size:18px}.nb button.on{background:rgba(255,255,255,.18);color:#fff}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
.dk{display:none}@media (min-width:900px){.dk{display:block}}
@media (min-width:900px){
body{max-width:none;padding:20px 28px 40px}
#start{max-width:520px;margin:0 auto}
#main{max-width:none;margin:0;padding-left:216px}
.nb{left:16px;right:auto;top:16px;bottom:16px;width:196px;flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 10px;border-radius:18px}
.nb button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:10px 12px;min-height:44px}
.nb button span{font-size:20px;width:26px;text-align:center}
#s-home:not(.hide){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
#s-home>.card{margin:0}
.tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
#toast{bottom:28px}
}
@media (min-width:1400px){#s-home:not(.hide){grid-template-columns:repeat(3,minmax(0,1fr))}}

#ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}#ov img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:10px}#ov .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px}
.att{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.att .a{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--fld);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:4px}.att .a img{width:100%;height:100%;object-fit:cover}.att .d{position:absolute;top:2px;right:2px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border:0}.attbtn{display:block;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--fld);font-weight:600;cursor:pointer;margin:6px 0}
</style></head><body>

const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(p,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(obj,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await mkKey(p,salt),new TextEncoder().encode(JSON.stringify(obj)));
 return JSON.stringify({app:"kasse",v:2,n:obj&&obj.sec===3?3:1,...(obj&&obj.sec===3&&Array.isArray(obj.secq)?{q:obj.secq}:{}),salt:b64(salt),iv:b64(iv),data:b64(c)})}
const PSEP="\u241E",pwJoin=(a,b,c)=>[a,b,c].join(PSEP),pwParts=()=>String(pw).split(PSEP),ansN=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
async function dec(f,p){const c=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(f.iv)},await mkKey(p,unb64(f.salt)),unb64(f.data));
 return JSON.parse(new TextDecoder().decode(c))}

function tx(s){if(lang==="de"||!s)return s;const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];if(!c)return s;
 const d=DICT[c];if(d)return m[1]+d[lang]+m[3];

let obs=null,busy=false,pend=false;
function watch(){if(typeof MutationObserver==="undefined")return;
 if(!obs)obs=new MutationObserver(()=>{if(busy||pend)return;pend=true;requestAnimationFrame(()=>{pend=false;applyLang()})});
 obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["placeholder"]})}
function applyLang(){
 if(busy||typeof document.createTreeWalker!=="function")return;busy=true;
 try{if(obs)obs.disconnect();
  const w=document.createTreeWalker(document.body,4);let n;
  while((n=w.nextNode())){const p=n.parentNode&&n.parentNode.tagName;if(p==="SCRIPT"||p==="STYLE")continue;
   if(n.__t===undefined||n.nodeValue!==n.__t)n.__o=n.nodeValue;
   const o=tx(n.__o);if(n.nodeValue!==o)n.nodeValue=o;n.__t=o}
  document.querySelectorAll("[placeholder]").forEach(e=>{if(e.__pt===undefined||e.placeholder!==e.__pt)e.__po=e.placeholder;
   const o=tx(e.__po);if(e.placeholder!==o)e.placeholder=o;e.__pt=o})
 }finally{busy=false;watch()}}

async function fetchRates(quiet){const r=data.rates;
 if(typeof navigator!=="undefined"&&navigator.onLine===false){ui.rs="off";rRates();if(!quiet)toast("Keine Verbindung");return}
 ui.rs="busy";rRates();
 try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  const res=await fetch(RSRC,{signal:ac.signal,cache:"no-store"});clearTimeout(t);
  if(!res.ok)throw new Error("http");const j=await res.json();
  const eg=Number(j&&j.xau&&j.xau.price),ug=Number(j&&j.per_gram_usd);
  if(!(eg>0)||!(ug>0))throw new Error("data");
  if(j.stale===true){ui.rs="old";rRates();if(!quiet)toast("Quelle meldet veraltete Daten");return}
  if(!Array.isArray(r.adj))r.adj=["",""];
  const gb=BC()==="USD"?ug:eg,fx=BC()==="USD"?ug/eg:eg/ug,gk=f2c(gb+parse(r.adj[0]),2),gv=f2c(gb+parse(r.adj[1]),2),u=f2c(fx,4);r.gold=[gk,gv];r.usd=[u,u];r.at=now();r.net=now();ui.rs="";
  rRates();if(ui.s==="prod"&&ui.pd)calcP();if(!quiet)toast("Kurse aktualisiert")}
 catch(e){ui.rs=(typeof navigator!=="undefined"&&navigator.onLine===false)?"off":"err";rRates();if(!quiet)toast("Abruf fehlgeschlagen")}}

 if(x.k==="mat"){const s=data.stock.find(y=>y.id===x.ref);return s?f3(parse(x.qty))+" "+(UL[s.unit]||"")+" "+s.name:"?"}
